# CI Gate de dependencias (SCA). Este repo declara dependencias vulnerables a propósito,
# así que los dos jobs FALLAN: eso es justamente lo que demuestra la charla.
# Se corre a mano (Actions → SCA → Run workflow) y en los pull requests.
name: SCA

on:
  workflow_dispatch:
  pull_request:

jobs:
  trivy:
    name: Trivy (sin API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escanear dependencias (falla con HIGH o CRITICAL)
        # Fijada por SHA y no por etiqueta: una etiqueta se puede mover, un commit no.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  dependency-check:
    name: OWASP Dependency-Check (CVSS >= 7)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # La base de CVE de la NVD se cachea entre ejecuciones (la primera descarga es lenta)
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Escanear dependencias (falla con CVSS >= 7)
        run: ./mvnw -B dependency-check:check -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
